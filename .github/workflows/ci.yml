name: CI

# Every branch and every pull request. Until this file existed, the test
# suite had only ever run on one laptop, so "103 tests pass" was a claim
# nobody else could check — including a reviewer reading the repo.
on:
  push:
  pull_request:

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Types, lint, test, build
    runs-on: ubuntu-latest
    # The Next.js app is in app/, not the repo root.
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Next.js generates the route-aware globals (LayoutProps, PageProps)
      # into .next/types, which is gitignored. app/layout.tsx uses
      # LayoutProps<"/">, so on a clean checkout tsc fails with
      # "Cannot find name 'LayoutProps'" until they exist. typegen is much
      # cheaper than a full build, so the type check still runs first.
      - name: Generate route types
        run: npx next typegen

      # Run before the build: tsc reports every type error, whereas a failed
      # build can stop at the first one.
      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # No API keys are configured here on purpose: the build and tests must
      # pass with none, which is what keeps the offline path honest.
      - name: Build
        run: npm run build
